[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logvault"
version = "0.7.1"
description = "Download Warcraft Logs reports into local human-readable bundles."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LogVault" }]
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
logvault = "logvault.cli:main"
logvault-gui = "logvault.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
