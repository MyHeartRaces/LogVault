name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: LogVault-windows-x64
            artifact_path: release/*
          - os: ubuntu-latest
            artifact_name: LogVault-linux-x64
            artifact_path: release/*
          - os: macos-latest
            artifact_name: LogVault-macos
            artifact_path: release/*

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux Tk libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zstd

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
        env:
          PYTHONPATH: src

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm LogVault.spec

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\LogVault.iss"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/LogVault.exe release/LogVault-windows-x64-portable.exe
            cp installer/LogVault-Setup-*-x64.exe release/
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            cp dist/LogVault release/LogVault-linux-x64-portable
            chmod +x release/LogVault-linux-x64-portable
            cp scripts/install_linux_desktop.sh release/install_linux_desktop.sh
            cp assets/logvault.svg release/logvault.svg
            chmod +x scripts/package_arch_binary.sh
            ./scripts/package_arch_binary.sh
          else
            chmod +x scripts/package_macos_app.sh
            ./scripts/package_macos_app.sh
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
