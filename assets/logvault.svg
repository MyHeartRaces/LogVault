          font-weight="900"
          letter-spacing="0"
          fill="#100b07"
          stroke="#050505"
          stroke-width="44"
          paint-order="stroke fill">LV</text>
    <text x="512" y="604"
          text-anchor="middle"
          font-family="Cinzel Decorative, Friz Quadrata, Georgia, Times New Roman, serif"
          font-size="330"
          font-weight="900"
          letter-spacing="0"
          fill="url(#innerGold)"
          stroke="#fff0aa"
