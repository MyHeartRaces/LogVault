<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LogVault app icon</title>
  <desc id="desc">A gothic fantasy app icon matching the LogVault wordmark.</desc>
  <defs>
    <linearGradient id="steel" x1="140" y1="88" x2="860" y2="932" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28323d"/>
      <stop offset="0.48" stop-color="#111820"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="gold" x1="200" y1="130" x2="830" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.3" stop-color="#d49a32"/>
      <stop offset="0.68" stop-color="#7f4b14"/>
      <stop offset="1" stop-color="#f4cf74"/>
    </linearGradient>
    <linearGradient id="innerGold" x1="300" y1="240" x2="730" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8bf"/>
      <stop offset="0.4" stop-color="#dfab42"/>
      <stop offset="1" stop-color="#9b611d"/>
    </linearGradient>
    <linearGradient id="arcane" x1="250" y1="250" x2="780" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bd4ff"/>
