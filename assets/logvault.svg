      <stop offset="1" stop-color="#1d4b78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f2c768" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="190" fill="#090b0f"/>
  <path d="M512 66 884 190v334c0 205-139 344-372 434C279 868 140 729 140 524V190z" fill="url(#steel)" stroke="#050608" stroke-width="28"/>
  <path d="M512 104 846 215v306c0 181-119 302-334 388-215-86-334-207-334-388V215z" fill="none" stroke="url(#gold)" stroke-width="36" stroke-linejoin="round"/>
  <path d="M512 170 778 258v248c0 145-88 243-266 318-178-75-266-173-266-318V258z" fill="#111820" stroke="#563714" stroke-width="10"/>

  <path d="M512 132 566 240 512 348 458 240zM512 676 566 784 512 892 458 784z" fill="#080b10" stroke="url(#gold)" stroke-width="18" stroke-linejoin="round"/>
  <path d="M196 426 304 480 412 426 304 372zM612 426 720 480 828 426 720 372z" fill="#080b10" stroke="url(#arcane)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M246 280h532M246 616h532" stroke="#cf922f" stroke-width="12" stroke-linecap="round" opacity="0.78"/>
  <path d="M278 316h468M278 580h468" stroke="#5aa2e2" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <g filter="url(#shadow)">
    <text x="512" y="604"
          text-anchor="middle"
